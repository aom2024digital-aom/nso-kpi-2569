<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      padding: 30px;
      max-width: 500px;
      margin: auto;
    }
    .card {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .btn-upload {
      background-color: #0d6efd;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn-upload:hover {
      background-color: #0b5ed7;
    }
    .btn-view {
      background-color: #198754;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
      margin-top: 15px;
    }
    .btn-view:hover {
      background-color: #157347;
    }
    #statusMessage {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>อัปโหลดเอกสาร</h3>
    <input type="file" id="fileInput" />
    <br>
    <button class="btn-upload" onclick="uploadFile()" id="uploadBtn">อัปโหลดไฟล์</button>
    
    <!-- พื้นที่แสดงข้อความสถานะ -->
    <div id="statusMessage"></div>
    
    <!-- พื้นที่แสดงปุ่มดูไฟล์ (จะปรากฏเมื่ออัปโหลดเสร็จ) -->
    <div id="buttonContainer"></div>
  </div>

  <script>
    function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const statusMessage = document.getElementById('statusMessage');
      const buttonContainer = document.getElementById('buttonContainer');
      const uploadBtn = document.getElementById('uploadBtn');

      // ตรวจสอบว่าเลือกไฟล์หรือยัง
      if (fileInput.files.length === 0) {
        alert('กรุณาเลือกไฟล์ก่อนอัปโหลด');
        return;
      }

      const file = fileInput.files[0];
      
      // แสดงสถานะกำลังโหลด
      statusMessage.innerHTML = "<span style='color: #fd7e14;'>กำลังอัปโหลด... กรุณารอสักครู่</span>";
      buttonContainer.innerHTML = ""; // ล้างปุ่มเดิมออก
      uploadBtn.disabled = true; // ป้องกันการกดซ้ำ

      // อ่านไฟล์และแปลงเป็น Base64
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result;
        const fileName = file.name;

        // เรียกใช้ฟังก์ชันฝั่ง Google Apps Script
        google.script.run
          .withSuccessHandler(function(response) {
            uploadBtn.disabled = false; // เปิดให้ปุ่มกดได้อีกครั้ง
            
            if (response.status === "success") {
              statusMessage.innerHTML = "<span style='color: #198754;'>อัปโหลดสำเร็จ!</span>";
              fileInput.value = ""; // รีเซ็ตช่องเลือกไฟล์
              
              // สร้างปุ่มดูไฟล์
              buttonContainer.innerHTML = `<a href="${response.url}" target="_blank" class="btn-view">👁️ ดูไฟล์ที่อัปโหลด</a>`;
            } else {
              statusMessage.innerHTML = "<span style='color: #dc3545;'>เกิดข้อผิดพลาด: " + response.message + "</span>";
            }
          })
          .uploadFileToDrive(base64Data, fileName);
      };
      reader.readAsDataURL(file);
    }
  </script>

</body>
</html>
