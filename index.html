<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>NSO SATUN KPI - Optimized UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #1e1e2d; --accent: #00A3AD; --danger: #ff4d4d; }
        body { font-family: 'Noto Sans Thai', sans-serif; background: #f4f6f9; display: flex; height: 100vh; margin: 0; font-size: 11px; overflow: hidden; }
        
        .sidebar { width: 220px; background: var(--primary); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-menu { flex: 1; overflow-y: auto; }
        .nav-btn { padding: 10px 15px; color: rgba(255,255,255,0.7); cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); text-decoration: none; display: block; }
        .nav-btn:hover, .nav-btn.active { background: rgba(255,255,255,0.1); color: white; border-left: 4px solid var(--accent); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-nav { height: 48px; background: white; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        .content-body { flex: 1; padding: 10px; overflow-y: auto; }
        
        .table-card { background: white; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); padding: 8px; max-height: 82vh; overflow: auto; }
        
        /* บังคับ Wrap Text และ Alignment ชิดซ้ายบน */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { 
            border: 1px solid #eef2f7; 
            padding: 6px !important; 
            white-space: normal !important; 
            word-wrap: break-word; 
            vertical-align: top !important; 
            text-align: left !important;
            font-size: 11px;
        }
        th { background: #f8f9fa !important; position: sticky; top: 0; z-index: 10; font-weight: 600; text-align: center !important; }
        
        .high-alert { color: var(--danger) !important; font-weight: bold; }
        input { width: 100%; border: none; background: transparent; text-align: left; font-size: 11px; }
        textarea { width: 100%; min-height: 60px; border: 1px solid #eef2f7; border-radius: 3px; font-size: 10px; padding: 4px; resize: vertical; }
        .filter-area { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="p-3 text-center border-bottom border-secondary"><h6>NSO SATUN 2569</h6></div>
    <div class="sidebar-menu">
        <div id="ward-nav"></div>
        <a class="nav-btn" onclick="loadTab('กองการ_68')"><i class="bi bi-folder"></i> กองการ_68</a>
        <a class="nav-btn" onclick="loadTab('IC')"><i class="bi bi-activity"></i> IC Analytics</a>
        <a class="nav-btn" onclick="loadTab('NQA')"><i class="bi bi-shield-check"></i> NQA (Read-Only)</a>
    </div>
</nav>

<main class="main-content">
    <div class="top-nav">
        <span id="page-title" class="fw-bold text-primary">กรุณาเลือกเมนู</span>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-primary px-3" onclick="saveData()">บันทึก</button>
            <button class="btn btn-sm btn-dark px-3" onclick="fetchData()">ดึงข้อมูล</button>
            <button class="btn btn-sm btn-outline-success px-3" onclick="exportToExcel()">Export</button>
            <button id="btn-cap" class="btn btn-sm btn-info text-white d-none" onclick="doCapture()">Capture</button>
        </div>
    </div>

    <div class="content-body" id="capture-zone">
        <div class="filter-area">
            <input type="text" id="search-q" class="form-control form-control-sm" style="width:180px" placeholder="🔎 ค้นหาตัวชี้วัด..." onkeyup="applyFilters()">
            <select id="month-q" class="form-select form-select-sm" style="width:130px" onchange="applyFilters()"><option value="">-- เดือน --</option></select>
            <select id="freq-q" class="form-select form-select-sm" style="width:130px" onchange="applyFilters()"><option value="">-- ความถี่ --</option></select>
        </div>
        <div id="table-view" class="table-card overflow-auto">
            <p class="text-center py-5 text-muted">พร้อมใช้งาน กรุณาเลือกชีทงาน</p>
        </div>
    </div>
</main>

<script>
    const API_URI = "https://script.google.com/macros/s/AKfycbwrnmxTqTndEjvw2-CesCfm7A3zTQfAK5juajH0bcDs9fUjoPSbF4ul4CBXQhl_perujg/exec";
    let activeSheet = "", cachedData = [];

    window.onload = () => {
        fetch(`${API_URI}?action=getWards`).then(res => res.json()).then(wards => {
            document.getElementById('ward-nav').innerHTML = wards.map(w => 
                `<a class="nav-btn" onclick="loadTab('${w}')"><i class="bi bi-hospital"></i> ${w}</a>`
            ).join('');
        });
    };

    function loadTab(name) {
        activeSheet = name;
        document.getElementById('page-title').innerText = "📍 " + name;
        document.getElementById('btn-cap').classList.toggle('d-none', activeSheet !== 'IC');
        fetchData();
    }

    function fetchData() {
        const view = document.getElementById('table-view');
        view.innerHTML = '<p class="text-center py-5">กำลังดึงข้อมูล...</p>';
        fetch(`${API_URI}?action=getData&sheetName=${activeSheet}`).then(res => res.json()).then(data => {
            cachedData = data;
            renderUI(data);
        });
    }

    function renderUI(data) {
        if(!data.length) return;
        const head = data[0];
        
        // กำหนดคอลัมน์ที่ต้องแสดงตามเงื่อนไขชีท
        let showCols = [];
        if(activeSheet.toLowerCase().startsWith('ward')) {
            showCols = ['รายการตัวชี้วัด','เป้าหมาย','ความถี่','ตค.68','พย','ธค','มค.69','กพ','มีค','เมย','พค','มิย','กค','สค','กย','สรุป','วิเคราะห์'];
        } else if(activeSheet === 'NQA') {
            showCols = ['เป้าหมาย','ความถี่','รายการตัวชี้วัด','66','67','68','ตค.68','พย','ธค','มค.69','กพ','มีค','ไตรมาส 1','ไตรมาส 2','ไตรมาส 3','ไตรมาส 4','2569','สรุป','วิเคราะห์'];
        } else if(activeSheet === 'กองการ_68') {
            showCols = ['รหัส','ข้อมูล','ชื่อข้อมูล','ตัวตั้ง','ตัวหาร','ผลลัพธ์','สรุป','วิเคราะห์'];
        } else if(activeSheet === 'IC') {
            showCols = ['ตำแหน่ง','ตัวตั้งตัวหาร','63','64','65','66','67','68','ต.ค.-68','พ.ย.-68','ธ.ค.-68','มค.69','กพ','มีค','เมย','พค','มิย','กค','สค','กย','สรุป','วิเคราะห์'];
        }

        const colIndices = showCols.map(c => head.indexOf(c)).filter(i => i !== -1);
        const targetIdx = head.indexOf('เป้าหมาย');
        const freqIdx = head.indexOf('ความถี่');

        let html = `<table id="kpi-table"><thead><tr>`;
        colIndices.forEach(i => html += `<th>${head[i]}</th>`);
        html += `<th>แนบไฟล์</th></tr></thead><tbody>`;

        for(let i=1; i<data.length; i++){
            html += `<tr>`;
            colIndices.forEach(idx => {
                let cell = data[i][idx];
                let headName = head[idx];
                let isAlert = (typeof cell === 'number' && cell > (data[i][targetIdx] || 999)) ? "high-alert" : "";
                let display = (typeof cell === 'number') ? cell.toFixed(2) : (cell || "");
                let isReadOnly = (activeSheet === 'NQA' && headName !== 'วิเคราะห์');

                // Logic หาค่าเฉลี่ยสำหรับคอลัมน์ "สรุป" ใน Ward
                if(headName === 'สรุป' && activeSheet.toLowerCase().startsWith('ward')) {
                    let nums = data[i].slice(4, 16).filter(v => typeof v === 'number');
                    display = nums.length ? (nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2) : "0.00";
                }

                if(headName === 'วิเคราะห์') {
                    html += `<td><textarea onchange="updateData(${i},${idx},this.value)">${display}</textarea></td>`;
                } else {
                    html += `<td>${isReadOnly ? `<span>${display}</span>` : `<input type="text" class="${isAlert}" value="${display}" onchange="updateData(${i},${idx},this.value)">`}</td>`;
                }
            });
            html += `<td><input type="file" style="font-size:9px" onchange="doUpload(this, ${i})"></td></tr>`;
        }
        html += `</tbody></table>`;
        document.getElementById('table-view').innerHTML = html;
        
        // อัปเดตฟิลเตอร์
        const fMonth = document.getElementById('month-q');
        fMonth.innerHTML = '<option value="">-- เดือน --</option>';
        head.forEach((h, i) => { if(h.includes('ตค') || h.includes('มค')) fMonth.add(new Option(h, i)); });
        
        const fFreq = document.getElementById('freq-q');
        fFreq.innerHTML = '<option value="">-- ความถี่ --</option>';
        [...new Set(data.slice(1).map(r => r[freqIdx]))].filter(String).forEach(v => fFreq.add(new Option(v, v)));
    }

    function updateData(r, c, v) { cachedData[r][c] = v; }

    function applyFilters() {
        const q = document.getElementById('search-q').value.toLowerCase();
        const freq = document.getElementById('freq-q').value;
        const rows = document.querySelectorAll("#kpi-table tbody tr");
        rows.forEach(r => {
            const txt = r.innerText.toLowerCase();
            const matchQ = txt.includes(q);
            const matchFreq = freq === "" || txt.includes(freq.toLowerCase());
            r.style.display = (matchQ && matchFreq) ? "" : "none";
        });
    }

    function saveData() {
        fetch(API_URI, { method: "POST", mode: "no-cors", body: JSON.stringify({ sheetName: activeSheet, data: cachedData.slice(1) }) })
        .then(() => alert("✅ ส่งข้อมูลสำเร็จ"));
    }

    async function doUpload(input, rIdx) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = async (e) => {
            const res = await fetch(API_URI, { method: "POST", body: JSON.stringify({ action: 'uploadFile', file: e.target.result, name: file.name }) });
            const url = await res.text();
            cachedData[rIdx][cachedData[0].indexOf('วิเคราะห์')] += ` \n📎 ไฟล์: ${url}`;
            alert("📁 แนบไฟล์สำเร็จ");
            fetchData();
        };
        reader.readAsDataURL(file);
    }

    function exportToExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById('kpi-table')), `${activeSheet}.xlsx`); }
    function doCapture() { html2canvas(document.getElementById('capture-zone')).then(cv => { let a = document.createElement('a'); a.download = 'Capture.png'; a.href = cv.toDataURL(); a.click(); }); }
</script>
</body>
</html>
