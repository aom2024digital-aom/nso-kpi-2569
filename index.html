<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>NSO SATUN 2569</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1a1a2e; --accent: #00d2d3; }
        body { font-family: 'Noto Sans Thai', sans-serif; background: #f0f2f5; height: 100vh; margin: 0; font-size: 10px; overflow: hidden; display: flex; }
        .login-overlay { position: fixed; inset: 0; background: var(--primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .sidebar { width: 200px; background: var(--primary); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-menu { flex: 1; overflow-y: auto; }
        .nav-btn { padding: 8px 15px; color: #adb5bd; cursor: pointer; border-bottom: 1px solid #2d2d44; display: block; text-decoration: none; }
        .nav-btn:hover, .nav-btn.active { background: #2d2d44; color: white; border-left: 3px solid var(--accent); }
        .main-app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-nav { height: 45px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        .content-area { flex: 1; padding: 10px; overflow-y: auto; }
        .table-wrap { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 5px; max-height: 85vh; overflow: auto; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid #eee; padding: 4px; vertical-align: top; text-align: left; }
        th { background: #f8f9fa !important; position: sticky; top: 0; z-index: 10; text-align: center; font-weight: 600; }
        
        /* แก้ไขปัญหาข้อความยาวด้วย scrolling ในเซลล์ */
        .scroll-cell { max-height: 50px; overflow-y: auto; white-space: normal; word-break: break-word; line-height: 1.2; }
        
        .high-alert { color: #ff4d4d !important; font-weight: bold; }
        input[type="text"] { width: 100%; border: none; background: transparent; font-size: 10px; }
        textarea { width: 100%; height: 50px; font-size: 9px; border: 1px solid #eee; }
        .action-btns { display: flex; gap: 2px; }
    </style>
</head>
<body>

<div id="login-screen" class="login-overlay">
    <div class="bg-white p-4 rounded shadow text-center" style="width: 300px;">
        <h5 class="mb-3">เข้าสู่ระบบ NSO SATUN</h5>
        <input type="text" id="log-user" class="form-control mb-2" placeholder="Username (WARD 1, ER...)">
        <input type="password" id="log-pass" class="form-control mb-3" placeholder="Password">
        <button class="btn btn-primary w-100" onclick="handleLogin()">Login</button>
    </div>
</div>

<nav class="sidebar">
    <div class="p-3 text-center border-bottom border-secondary"><h6>NSO SATUN</h6></div>
    <div class="sidebar-menu" id="ward-nav"></div>
    <a class="nav-btn" onclick="loadTab('กองการ_68')">กองการ_68</a>
    <a class="nav-btn" onclick="loadTab('IC')">IC Analytics</a>
    <a class="nav-btn" onclick="loadTab('NQA')">NQA (Read-Only)</a>
</nav>

<main class="main-app">
    <div class="top-nav">
        <span id="title-text" class="fw-bold text-primary">KPI 2569</span>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-primary" onclick="saveData()">บันทึก</button>
            <button class="btn btn-sm btn-dark" onclick="fetchData()">ดึงข้อมูล</button>
            <button class="btn btn-sm btn-outline-success" onclick="exportToExcel()">Export</button>
        </div>
    </div>
    <div class="content-area">
        <div id="table-view" class="table-wrap"></div>
    </div>
</main>

<script>
    const API = "https://script.google.com/macros/s/AKfycbwrnmxTqTndEjvw2-CesCfm7A3zTQfAK5juajH0bcDs9fUjoPSbF4ul4CBXQhl_perujg/exec";
    let currentSheet = "", master = [];

    function handleLogin() {
        const user = document.getElementById('log-user').value;
        const pass = document.getElementById('log-pass').value;
        fetch(API, { method: "POST", body: JSON.stringify({ action: 'login', user, pass }) })
        .then(r => r.json()).then(res => {
            if(res.success) {
                document.getElementById('login-screen').style.display = 'none';
                initMenu();
            } else alert(res.msg);
        });
    }

    function initMenu() {
        fetch(`${API}?action=getWards`).then(r => r.json()).then(data => {
            document.getElementById('ward-nav').innerHTML = data.map(w => `<a class="nav-btn" onclick="loadTab('${w}')">${w}</a>`).join('');
        });
    }

    function loadTab(name) {
        currentSheet = name;
        document.getElementById('title-text').innerText = name;
        fetchData();
    }

    function fetchData() {
        document.getElementById('table-view').innerHTML = '<p class="text-center p-5">Loading...</p>';
        fetch(`${API}?action=getData&sheetName=${currentSheet}`).then(r => r.json()).then(data => {
            master = data;
            render(data);
        });
    }

    function render(data) {
        if(!data.length) return;
        const head = data[0];
        let html = `<table><thead><tr>`;
        head.forEach(h => html += `<th>${h}</th>`);
        html += `<th>จัดการไฟล์</th></tr></thead><tbody>`;

        const targetIdx = head.indexOf('เป้าหมาย');

        for(let i=1; i<data.length; i++) {
            html += `<tr>`;
            data[i].forEach((cell, idx) => {
                let target = parseFloat(data[i][targetIdx]) || 999;
                let val = (typeof cell === 'number') ? cell.toFixed(2) : (cell || "");
                let alert = (typeof cell === 'number' && cell > target) ? "high-alert" : "";
                
                if(head[idx] === 'วิเคราะห์') {
                    html += `<td><textarea onchange="upd(${i},${idx},this.value)">${val}</textarea></td>`;
                } else {
                    html += `<td><div class="scroll-cell ${alert}">${val.length > 20 ? `<div class="scroll-cell">${val}</div>` : `<input type="text" value="${val}" onchange="upd(${i},${idx},this.value)">`}</div></td>`;
                }
            });
            const fileLink = master[i][head.indexOf('วิเคราะห์')].match(/https:\/\/drive\.google\.com[^\s]*/);
            html += `<td><div class="action-btns">
                <input type="file" style="display:none" id="f-${i}" onchange="doUp(${i})">
                <button class="btn btn-xs btn-primary p-0" onclick="document.getElementById('f-${i}').click()">คัดเลือก</button>
                ${fileLink ? `<button class="btn btn-xs btn-info p-0" onclick="window.open('${fileLink[0]}')">ดู</button>` : ''}
            </div></td></tr>`;
        }
        document.getElementById('table-view').innerHTML = html + `</tbody></table>`;
    }

    function upd(r, c, v) { master[r][c] = v; }

    function saveData() {
        fetch(API, { method: "POST", mode: "no-cors", body: JSON.stringify({ sheetName: currentSheet, data: master.slice(1) }) })
        .then(() => alert("ส่งข้อมูลบันทึกแล้ว"));
    }

    function doUp(idx) {
        const file = document.getElementById(`f-${idx}`).files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            fetch(API, { method: "POST", body: JSON.stringify({ action: 'upload', file: e.target.result, name: file.name }) })
            .then(r => r.text()).then(url => {
                master[idx][master[0].indexOf('วิเคราะห์')] += ` \nLink: ${url}`;
                alert("อัปโหลดสำเร็จ");
                fetchData();
            });
        };
        reader.readAsDataURL(file);
    }

    function exportToExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById('table-view')), `${currentSheet}.xlsx`); }
</script>
</body>
</html>
